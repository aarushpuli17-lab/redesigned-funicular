<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Our Love Quiz 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Trebuchet MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #c06c84 25%, #6c5b7b 50%, #355c7d 75%, #ff6b9d 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: popIn 0.6s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ff6b9d;
            font-size: 2.5em;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .heart-rain {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #6c5b7b;
            font-size: 1.1em;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #c06c84, #6c5b7b, #355c7d);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .question-number {
            color: #ff6b9d;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question-text {
            color: #355c7d;
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            position: relative;
        }

        .option input[type="radio"] {
            display: none;
        }

        .option label {
            display: block;
            padding: 15px 20px;
            background: linear-gradient(135deg, #f5f5f5, #ffffff);
            border: 3px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05em;
            color: #333;
        }

        .option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #ff6b9d, #c06c84);
            border-color: #c06c84;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }

        .option label:hover {
            border-color: #ff6b9d;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.2);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .btn-next {
            background: linear-gradient(135deg, #ff6b9d, #c06c84);
            color: white;
            flex: 1;
        }

        .btn-next:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.4);
        }

        .btn-prev {
            background: #f0f0f0;
            color: #355c7d;
            flex: 1;
        }

        .btn-prev:hover {
            background: #e0e0e0;
            transform: translateY(-3px);
        }

        .result-screen {
            display: none;
            text-align: center;
            animation: popIn 0.6s ease-out;
        }

        .result-screen.show {
            display: block;
        }

        .result-emoji {
            font-size: 5em;
            margin-bottom: 20px;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }

        .result-title {
            color: #ff6b9d;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .result-message {
            color: #6c5b7b;
            font-size: 1.3em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .score-box {
            background: linear-gradient(135deg, #ff6b9d, #c06c84);
            color: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: bold;
        }

        .score-label {
            font-size: 0.9em;
            margin-top: 10px;
        }

        .btn-restart {
            background: linear-gradient(135deg, #6c5b7b, #355c7d);
            color: white;
            padding: 15px 40px;
            font-size: 1.1em;
        }

        .btn-restart:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(53, 92, 125, 0.4);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .question-text {
                font-size: 1.2em;
            }

            .result-emoji {
                font-size: 3.5em;
            }

            .result-title {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="heart-rain">💕 🎮 💕</div>
            <h1>Our Love Quiz</h1>
            <p class="subtitle">How well do you know us? 💑</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection">
            <div class="question-section">
                <div class="question-number" id="questionNumber">Question 1 of 4</div>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="optionsContainer"></div>
            </div>

            <div class="buttons">
                <button class="btn-prev hidden" id="prevBtn" onclick="previousQuestion()">← Previous</button>
                <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <!-- Result Section -->
        <div class="result-screen" id="resultScreen">
            <div class="result-emoji" id="resultEmoji">💕</div>
            <div class="result-title" id="resultTitle">Amazing!</div>
            <div class="result-message" id="resultMessage">You know our love story so well!</div>
            <div class="score-box">
                <div id="scorePercentage">100%</div>
                <div class="score-label">Love Score</div>
            </div>
            <button class="btn-restart" onclick="restartQuiz()">🔄 Try Again</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "🌟 What's the best part about us?",
                options: [
                    "Your amazing smile and laugh 😊",
                    "How you make me feel complete 💫",
                    "Every moment together feels like home 🏠",
                    "Everything! You're perfect 👑"
                ]
            },
            {
                question: "💭 When did you realize you wanted us forever?",
                options: [
                    "From the very first moment I saw you 👀",
                    "During our first conversation 💬",
                    "When I saw how kind you are 💖",
                    "The moment you became my favorite person 🌈"
                ]
            },
            {
                question: "🎬 One moment you always want to recreate?",
                options: [
                    "That first kiss 💋",
                    "Late night talks under the stars ⭐",
                    "Walking hand in hand at sunset 🌅",
                    "Lazy mornings just being together 🛏️"
                ]
            },
            {
                question: "💕 How much do you love me?",
                options: [
                    "To the moon and back 🌙",
                    "More than words can say 📝",
                    "Infinitely and forever ♾️",
                    "With all my heart and soul ❤️"
                ]
            }
        ];

        let currentQuestion = 0;
        let answers = [];
        let isAnswered = false;

        function initQuiz() {
            currentQuestion = 0;
            answers = [];
            isAnswered = false;
            document.getElementById('quizSection').style.display = 'block';
            document.getElementById('resultScreen').classList.remove('show');
            loadQuestion();
        }

        function loadQuestion() {
            const question = quizData[currentQuestion];
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('questionNumber').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerHTML = `
                    <input type="radio" id="option${index}" name="answer" value="${index}" onchange="selectOption()">
                    <label for="option${index}">${option}</label>
                `;
                optionsContainer.appendChild(optionDiv);
            });

            if (answers[currentQuestion] !== undefined) {
                document.getElementById(`option${answers[currentQuestion]}`).checked = true;
            }

            updateProgress();
            updateButtons();
            isAnswered = false;
        }

        function selectOption() {
            isAnswered = true;
        }

        function nextQuestion() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected && !isAnswered) {
                alert('💭 Please select an answer first! 💕');
                return;
            }

            if (selected) {
                answers[currentQuestion] = parseInt(selected.value);
            }

            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function updateButtons() {
            document.getElementById('prevBtn').classList.toggle('hidden', currentQuestion === 0);
            document.getElementById('nextBtn').textContent = currentQuestion === quizData.length - 1 ? '💕 Finish!' : 'Next →';
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResults() {
            const score = answers.length;
            const percentage = Math.round((score / quizData.length) * 100);

            document.getElementById('quizSection').style.display = 'none';
            document.getElementById('resultScreen').classList.add('show');

            let emoji, title, message;

            if (percentage === 100) {
                emoji = '👑💕';
                title = 'Perfect! 💫';
                message = 'You know our love story completely! You\'re my soulmate! 💑✨ Every answer was perfect, just like you!';
            } else if (percentage >= 75) {
                emoji = '😍💖';
                title = 'Amazing! 🌟';
                message = 'You truly understand our love! You know me so well! This just makes me love you even more! 💕';
            } else if (percentage >= 50) {
                emoji = '🥰💗';
                title = 'Great! 💕';
                message = 'You got most of it! Our bond is special and keeps getting stronger! ❤️✨';
            } else {
                emoji = '😘';
                title = 'You tried! 💖';
                message = 'But that\'s okay! We\'re writing our love story together every day! Let\'s make more memories! 💕';
            }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('scorePercentage').textContent = percentage + '%';
        }

        function restartQuiz() {
            initQuiz();
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
