<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose Day Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffefef;
            overflow: hidden;
            margin: 0;
        }
        .rose {
            width: 100px;
            height: 100px;
            background-image: url('https://example.com/rose.png');
            background-size: cover;
            position: absolute;
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        .emoji {
            font-size: 50px;
            position: absolute;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .message {
            font-size: 2em;
            color: #ff007f;
            position: absolute;
            bottom: 20%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="rose"></div>
    <div class="emoji" style="top: 20%; left: 10%;">💖</div>
    <div class="emoji" style="top: 30%; right: 15%;">💋</div>
    <div class="emoji" style="top: 40%; left: 30%;">🌹</div>
    <div class="message">Happy Rose Day! Sending you all my love! 🌹💖💋</div>
</body>
</html>
